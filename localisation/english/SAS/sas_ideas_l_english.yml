l_english:
  Racial_tensions:0 "Racial Tensions"
  Racial_tensions_desc:0 "We are new here and the humans are not happy about it. We need to find a way to ease the tension and build trust with the humans."
  Racial_tensions_2:0 "Racial Tensions"
  Racial_tensions_2_desc:0 "We are new here and the humans are not happy about it. We need to find a way to ease the tension and build trust with the humans."
  Far_Home:0 "Remainder of Ponykind"
  Far_Home_desc:0 "We are in a place far from our home, and we need to find a way to survive and thrive in this new environment. Some ponies are scared, others are simply indifferent to the situation. But we are still united by the fact that we are all ponies."
  Shadow_Ministry:0 "Shadow of the Ministry"
  Shadow_Ministry_desc:0 "Before the war, the Ministry of Arcane Sciences, under the leadership of Twilight Sparkle, conducted numerous horrible experiments on ponies, in the hopes of finding a way to win the war against the Zebras. Starmatter worked in the Ministry during the war and was privy to many of the Ministry's secrets. After the war, Starmatter would continue their work, now independent of the Ministry, though the Ministry's influence would still be felt, always looming in the shadows."